[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdmath"
version = "0.1.0"
description = "On-policy self-distillation and budgeted math evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy"]

[project.optional-dependencies]
training = ["torch==2.8.0", "transformers==4.57.1", "peft==0.17.1", "accelerate==1.11.0", "safetensors==0.5.3"]
evaluation = ["torch==2.8.0", "transformers==4.57.1", "peft==0.17.1", "accelerate==1.11.0", "safetensors==0.5.3"]
figures = ["matplotlib", "Pillow"]
test = ["pytest", "torch==2.8.0"]

[project.scripts]
opsdmath-train = "opsdmath.cli:train"
opsdmath-evaluate = "opsdmath.cli:evaluate"
opsdmath-reproduce = "opsdmath.cli:reproduce"

[tool.setuptools.packages.find]
include = ["opsdmath*", "experiments.kl_ablation*", "experiments.gradient_audit*", "experiments.transfer_evaluation*"]
